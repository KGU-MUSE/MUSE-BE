# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!build/**"
    - "!bin/**"
    - "!.gradle/**"
    - "!.remember/**"
    - "!gradle/wrapper/gradle-wrapper.jar"
    - "!gradlew"
    - "!gradlew.bat"
  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        Java 21과 Spring Boot 기반 프로젝트다. 도메인 중심 패키지 구조를 유지한다.
        실제 오류, 보안 취약점, 트랜잭션 경계, JPA 조회 성능과 데이터 정합성을 우선 검토한다.
        Spring Security의 접근 제어와 오류 응답에서 민감정보가 노출되지 않는지 확인한다.
        요구하지 않은 기능이나 불필요한 추상화를 제안하지 않는다.
    - path: "src/main/resources/db/migration/**/*.sql"
      instructions: |
        PostgreSQL과 Flyway를 사용한다. 이미 적용된 마이그레이션 수정은 피하고 새 버전을 추가한다.
        데이터 손실, 제약조건, 인덱스, 기존 데이터와의 호환성을 검토한다.
    - path: "src/test/**/*.java"
      instructions: |
        실제 동작과 오류 응답을 검증하는지 확인한다.
        DB 관련 검증은 PostgreSQL Testcontainers 통합 테스트를 사용한다.
        일반 test/build와 Docker가 필요한 integrationTest의 검증 범위를 구분한다.
    - path: "**/*.{yml,yaml,properties,gradle}"
      instructions: |
        환경변수, 비밀정보 노출, DB 연결 및 운영 시 안전한 기본값을 검토한다.
        로컬 개발 설정과 운영 설정을 구분한다. .env.example의 로컬 예제 값을 실제 자격증명으로 취급하지 않는다.
